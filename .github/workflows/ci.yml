name: ci

on:
  push:
    branches: [ "main" ]
    tags: ['*']
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # run it by hand from the Actions tab on any branch

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
      # The Windows runner defaults to core.autocrlf=true, which would turn the dotenvx submodule's fixture files into CRLF (this repo's
      # own files are pinned to LF by .gitattributes) and break tests that compare them byte for byte.
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22 # the parity suite and sweep run the real Node CLI: pin it so runner images cannot drift
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
      # Includes Dotenvx.ParityTest (part of Dotenvx.sln): it shells out to the real Node CLI in the dotenvx/ submodule
      # and diffs output against the built .NET CLI. NodeParityFixture runs `npm install` in dotenvx/ on first use.
    - name: Parity sweep (sample)
      run: node scripts/parity-sweep.js
      env:
        SWEEP_EVERY: 25
      # Every 25th of the ~15,000 command x flag x fixture scenarios, run against both CLIs (a few minutes); exits non-zero on any
      # unexpected difference. The full sweep (30 to 40 minutes per OS) is in sweep.yml: nightly and on demand.
    - name: Pack NuGet packages
      if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet pack src/Dotenvx -c Release -o artifacts
        dotnet pack src/Dotenvx.Primitives -c Release -o artifacts
        dotnet pack src/Dotenvx.Core -c Release -o artifacts
        dotnet pack src/Dotenvx.Configuration -c Release -o artifacts
    - name: Upload packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/*
