name: ci

on:
  push:
    branches: [ "main" ]
    tags: ['*']
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # run it by hand from the Actions tab on any branch
    inputs:
      full-parity:
        description: Also run the whole parity suite against the real Node CLI (15-45 minutes per OS); do this before a release
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Keep LF line endings
      run: git config --global core.autocrlf false
      # The Windows runner defaults to core.autocrlf=true, which would turn the dotenvx submodule's fixture files into CRLF (this repo's
      # own files are pinned to LF by .gitattributes) and break tests that compare them byte for byte.
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Node
      if: ${{ inputs.full-parity }}
      uses: actions/setup-node@v7
      with:
        node-version: 22 # the parity tests run the real Node CLI: pin it so runner images cannot drift
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Verify formatting
      run: dotnet format --no-restore --verify-no-changes
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName!~Dotenvx.ParityTest"
      # CI checks that the functionality works on every OS and takes about 2 minutes. Dotenvx.ParityTest (the real Node CLI against this
      # one) is slow: start this workflow by hand with full-parity ticked before a release
    - name: Full parity tests
      if: ${{ inputs.full-parity }}
      run: dotnet test test/Dotenvx.ParityTest --no-build --verbosity normal
    - name: Pack NuGet packages
      if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet pack src/Dotenvx -c Release -o artifacts
        dotnet pack src/Dotenvx.Primitives -c Release -o artifacts
        dotnet pack src/Dotenvx.Providers -c Release -o artifacts
        dotnet pack src/Dotenvx.Core -c Release -o artifacts
        dotnet pack src/Dotenvx.Configuration -c Release -o artifacts
    - name: Upload packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: artifacts/*
