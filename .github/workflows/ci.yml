name: ci

on:
  push:
    branches: [ "main" ]
    tags: ['*']
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  parity:
    # Runs the real Node dotenvx CLI (from the submodule) side by side with our built .NET CLI and
    # diffs output, to catch behavioral drift from the reference implementation. Separate from the
    # main build job (and continue-on-error) since it's new/unproven and has a hard Node/npm
    # dependency that the main job doesn't - shouldn't block merges on day one. Revisit once it's
    # been stable for a while. See CLAUDE.md's "Node parity test suite" section.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run parity suite
      run: dotnet test test/Dotenvx.ParityTest/Dotenvx.ParityTest.csproj --no-build --verbosity normal
